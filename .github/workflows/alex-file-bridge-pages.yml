name: Deploy Alex File Bridge
on:
  push:
    branches: [main]
    paths:
      - "alex-file-bridge/public/**"
      - ".github/workflows/alex-file-bridge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: alex-file-bridge/public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
